[versions]
forgeGradle       = "[7.0.29,8.0)"
renamer           = "1.1.8"
jvmDowngrader     = "2.0.1"
ideaExt           = "1.4.1"
shadow            = "9.6.1"
blossom           = "2.2.0"

[libraries]
forgeGradle       = { group = "net.minecraftforge"                                , name = "forgegradle"      ,                 version.ref = "forgeGradle"       }
renamer           = { group = "net.minecraftforge"                                , name = "renamer-gradle"   ,                 version.ref = "renamer"           }
jvmDowngrader     = { group = "xyz.wagyourtail.jvmdowngrader"                     , name = "gradle-plugin"    ,                 version.ref = "jvmDowngrader"     }
ideaExt           = { group = "gradle.plugin.org.jetbrains.gradle.plugin.idea-ext", name = "gradle-idea-ext"  ,                 version.ref = "ideaExt"           }
shadow            = { group = "com.gradleup.shadow"                               , name = "shadow-gradle-plugin",              version.ref = "shadow"            }
blossom           = { group = "net.kyori.blossom"                                 , name = "net.kyori.blossom.gradle.plugin",   version.ref = "blossom"           }